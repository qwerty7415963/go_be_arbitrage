run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - dupl
    - errname
    - errorlint
    - exhaustive
    - prealloc
    - exportloopref
    - gocritic
    - gofmt
    - goimports
    - gosec
    - misspell
    - nilerr
    - predeclared
    - unconvert
    - unparam
    - whitespace

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    check-shadowing: true

  gosec:
    rules:
      - rule: G101
        desc: "Potential hardcoded credentials"
        severity: medium

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style

  goimports:
    local-prefixes: github.com/<your-org>/arbitrage-be

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - gosec
        - errcheck
    - path: \.pb\.go$
      linters:
        - unused
        - errcheck
        - gosec

  max-issues-per-linter: 50
  max-same-issues: 5

severity:
  default-severity: warning
  rules:
    - linters:
        - gosec
      severity: error
    - linters:
        - errcheck
      severity: error

output:
  formats:
    - format: colored-line-number
  sort-results: true
  sort-order:
    - file
    - line
    - column
    - linter
    - severity
