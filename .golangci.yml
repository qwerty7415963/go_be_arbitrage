run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Bugs & Errors
    - errcheck           # Unchecked errors
    - govet              # Suspicious constructs
    - staticcheck        # Static analysis
    - bodyclose          # Unclosed HTTP bodies
    - nilerr             # Returning nil on error
    - errorlint          # Error wrapping best practices
    - contextcheck       # Context misuse

    # Code style
    - gofmt              # Formatting
    - goimports          # Import ordering
    - misspell           # Typos
    - whitespace         # Trailing whitespace
    - unconvert          # Unnecessary type conversions
    - errname            # Error naming conventions

    # Performance
    - prealloc           # Slice preallocation
    - gocritic           # Code diagnostics

    # Complexity
    - cyclop             # Function complexity
    - funlen             # Function length
    - gocognit           # Cognitive complexity

    # Security
    - gosec              # Security issues

    # Copy detection
    - dupl               # Duplicate code

    # Unused
    - unused             # Unused code
    - unparam            # Unused function params
    - ineffassign        # Ineffectual assignments

    # Other
    - exhaustive         # Exhaustive switch
    - predeclared        # Shadowing predeclared identifiers

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    check-shadowing: true

  gosec:
    rules:
      - rule: G101
        desc: "Potential hardcoded credentials"
        severity: medium

  gocritic:
    enabled-tags:
      - diagnostic
      - opinionated
      - performance
      - style

  goimports:
    local-prefixes: github.com/qwerty7415963/go_be_arbitrage

  cyclop:
    max-complexity: 15
    max-public-funcs: 20

  funlen:
    lines: 80
    statements: 50

  gocognit:
    min-complexity: 20

issues:
  exclude-rules:
    # Test files: relax some rules
    - path: _test\.go
      linters:
        - dupl
        - gosec
        - errcheck
        - funlen
        - cyclop
        - gocognit

    # Generated protobuf
    - path: \.pb\.go$
      linters:
        - unused
        - errcheck
        - gosec

    # Main package
    - path: cmd/
      linters:
        - funlen

  max-issues-per-linter: 50
  max-same-issues: 5

severity:
  default-severity: warning
  rules:
    - linters: [gosec]
      severity: error
    - linters: [errcheck]
      severity: error
    - linters: [govet]
      severity: error

output:
  formats:
    - format: colored-line-number
  sort-results: true
  sort-order:
    - file
    - line
    - column
    - linter
    - severity
