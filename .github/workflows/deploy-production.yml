name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Docker image tag to deploy (e.g., staging-abc1234)"
        required: true
        type: string
      skip-health-check:
        description: "Skip health check after deploy"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to staging image
        run: |
          echo "Deploying image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }}"

      - name: Pull staging image and retag for production
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }}
          docker tag \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-latest
          docker tag \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-${{ github.sha }}
          
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-${{ github.sha }}

  deploy:
    name: Deploy to Production
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Create backup snapshot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/arbitrage-be
            
            # Save current image tag for rollback
            CURRENT_IMAGE=$(docker compose -f docker-compose.production.yml images -q arbitrage-be | head -1)
            echo "Current image: $CURRENT_IMAGE" > /opt/arbitrage-be/.rollback-info
            
            # Create database backup
            docker compose -f docker-compose.production.yml exec -T postgres \
              pg_dump -U arbitrage arbitrage | gzip > /opt/arbitrage-be/backups/backup-$(date +%Y%m%d-%H%M%S).sql.gz

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/arbitrage-be
            
            # Update image tag
            export PRODUCTION_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-${{ github.sha }}"
            
            # Pull and restart
            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d --remove-orphans

      - name: Health check
        if: ${{ !inputs.skip-health-check }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            echo "Waiting for deployment to stabilize..."
            sleep 15
            
            # Health check with retries
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8080/health > /dev/null; then
                echo "✓ Health check passed (attempt $i)"
                exit 0
              fi
              echo "Attempt $i: Health check failed, retrying in 5s..."
              sleep 5
            done
            
            echo "✗ Health check failed after 5 attempts"
            docker compose -f docker-compose.production.yml logs --tail=100
            exit 1

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            echo "=== Service Status ==="
            docker compose -f docker-compose.production.yml ps
            echo ""
            echo "=== Recent Logs ==="
            docker compose -f docker-compose.production.yml logs --tail=30

  rollback:
    name: Rollback (on failure)
    needs: [deploy]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Rollback to previous version
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: deploy
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/arbitrage-be
            
            if [ -f .rollback-info ]; then
              echo "Rolling back..."
              docker compose -f docker-compose.production.yml down
              
              # Restore previous image
              PREVIOUS_IMAGE=$(cat .rollback-info | cut -d' ' -f3)
              docker tag "$PREVIOUS_IMAGE" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-latest"
              
              docker compose -f docker-compose.production.yml up -d
              
              sleep 10
              if curl -sf http://localhost:8080/health > /dev/null; then
                echo "✓ Rollback successful"
              else
                echo "✗ Rollback failed - manual intervention required"
                exit 1
              fi
            else
              echo "No rollback info found - manual intervention required"
              exit 1
            fi
