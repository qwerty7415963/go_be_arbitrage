services:
  postgres-test:
    image: postgres:16-alpine
    container_name: arbitrage-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: arbitrage_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d arbitrage_test"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata-test:
    driver: local
