basePath: /
definitions:
  api.ErrorBody:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
      request_id:
        type: string
    type: object
  api.HealthResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        example: healthy
        type: string
    type: object
  api.Meta:
    properties:
      cursor:
        type: string
      has_more:
        type: boolean
      limit:
        type: integer
    type: object
  api.PingResponse:
    properties:
      message:
        example: pong
        type: string
    type: object
  api.ReadyResponse:
    properties:
      status:
        example: ready
        type: string
    type: object
  api.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/api.ErrorBody'
      meta:
        $ref: '#/definitions/api.Meta'
      success:
        type: boolean
    type: object
  auth.AuthResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.ChangePasswordRequest:
    properties:
      new_password:
        maxLength: 128
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  fundingarbitrage.ArbitrageToken:
    properties:
      apr_1h_percent:
        type: number
      apr_4h_percent:
        type: number
      apy_percent:
        type: number
      funding_available:
        type: boolean
      instrument_id:
        type: string
      is_stale:
        type: boolean
      long_venue_id:
        type: string
      short_venue_id:
        type: string
      symbol:
        type: string
      venue_a_funding_rate:
        type: string
      venue_a_interval_seconds:
        type: integer
      venue_a_observed_at:
        type: string
      venue_a_symbol:
        type: string
      venue_b_funding_rate:
        type: string
      venue_b_interval_seconds:
        type: integer
      venue_b_observed_at:
        type: string
      venue_b_symbol:
        type: string
    type: object
  fundingarbitrage.FundingArbitrageResponse:
    properties:
      cache_status:
        type: string
      data_as_of:
        type: string
      pairs:
        items:
          $ref: '#/definitions/fundingarbitrage.Pair'
        type: array
    type: object
  fundingarbitrage.Pair:
    properties:
      tokens:
        items:
          $ref: '#/definitions/fundingarbitrage.ArbitrageToken'
        type: array
      venue_a:
        $ref: '#/definitions/fundingarbitrage.VenueInfo'
      venue_b:
        $ref: '#/definitions/fundingarbitrage.VenueInfo'
    type: object
  fundingarbitrage.VenueInfo:
    properties:
      code:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  fundingarbitrage.VenuePerp:
    properties:
      code:
        type: string
      id:
        type: string
      name:
        type: string
      venue_type:
        type: string
    type: object
  instrument.ContractType:
    enum:
    - LINEAR
    - INVERSE
    - SPOT
    - OTHER
    type: string
    x-enum-varnames:
    - ContractTypeLinear
    - ContractTypeInverse
    - ContractTypeSpot
    - ContractTypeOther
  instrument.CreateInstrumentRequest:
    properties:
      base_asset:
        type: string
      canonical_symbol:
        type: string
      contract_size:
        type: string
      contract_type:
        allOf:
        - $ref: '#/definitions/instrument.ContractType'
        enum:
        - LINEAR
        - INVERSE
        - SPOT
        - OTHER
      instrument_type:
        allOf:
        - $ref: '#/definitions/instrument.InstrumentType'
        enum:
        - SPOT
        - PERP
        - FUTURE
      margin_asset:
        type: string
      min_notional:
        type: string
      min_quantity:
        type: string
      price_tick:
        type: string
      quantity_step:
        type: string
      quote_asset:
        type: string
      settlement_asset:
        type: string
    required:
    - base_asset
    - canonical_symbol
    - contract_type
    - instrument_type
    - price_tick
    - quantity_step
    - quote_asset
    type: object
  instrument.CreateVenueInstrumentRequest:
    properties:
      instrument_id:
        type: string
      venue_id:
        type: string
      venue_symbol:
        type: string
    required:
    - instrument_id
    - venue_id
    - venue_symbol
    type: object
  instrument.DiscoveryStatus:
    enum:
    - DISCOVERED
    - REVIEWED
    - REJECTED
    type: string
    x-enum-varnames:
    - DiscoveryStatusDiscovered
    - DiscoveryStatusReviewed
    - DiscoveryStatusRejected
  instrument.EnableTradingRequest:
    properties:
      enabled:
        type: boolean
    type: object
  instrument.Instrument:
    properties:
      base_asset:
        type: string
      canonical_symbol:
        type: string
      contract_size:
        type: string
      contract_type:
        $ref: '#/definitions/instrument.ContractType'
      created_at:
        type: string
      discovery_status:
        $ref: '#/definitions/instrument.DiscoveryStatus'
      id:
        type: string
      instrument_type:
        $ref: '#/definitions/instrument.InstrumentType'
      margin_asset:
        type: string
      min_notional:
        type: string
      min_quantity:
        type: string
      price_tick:
        type: string
      quantity_step:
        type: string
      quote_asset:
        type: string
      settlement_asset:
        type: string
      trading_enabled:
        type: boolean
      updated_at:
        type: string
    type: object
  instrument.InstrumentType:
    enum:
    - SPOT
    - PERP
    - FUTURE
    type: string
    x-enum-varnames:
    - InstrumentTypeSpot
    - InstrumentTypePerp
    - InstrumentTypeFuture
  instrument.UpdateInstrumentRequest:
    properties:
      contract_size:
        type: string
      discovery_status:
        allOf:
        - $ref: '#/definitions/instrument.DiscoveryStatus'
        enum:
        - DISCOVERED
        - REVIEWED
        - REJECTED
      margin_asset:
        type: string
      min_notional:
        type: string
      min_quantity:
        type: string
      price_tick:
        type: string
      quantity_step:
        type: string
      settlement_asset:
        type: string
    type: object
  instrument.VenueInstrument:
    properties:
      first_seen_at:
        type: string
      id:
        type: string
      instrument_id:
        type: string
      last_seen_at:
        type: string
      status:
        type: string
      venue_id:
        type: string
      venue_metadata: {}
      venue_symbol:
        type: string
    type: object
  market.FundingEvent:
    properties:
      funding_rate:
        type: string
      id:
        type: integer
      index_price:
        type: string
      instrument_id:
        type: string
      interval_seconds:
        type: integer
      mark_price:
        type: string
      next_funding_at:
        type: string
      observed_at:
        type: string
      premium_rate:
        type: string
      source_event_id:
        type: integer
      venue_id:
        type: string
    type: object
  market.Subscription:
    properties:
      channel:
        type: string
      connectionID:
        type: string
      error: {}
      id:
        type: string
      instrumentID:
        type: string
      status:
        $ref: '#/definitions/market.SubscriptionStatus'
      venueID:
        type: string
    type: object
  market.SubscriptionStatus:
    enum:
    - PENDING
    - ACTIVE
    - FAILED
    - UNSUBSCRIBED
    type: string
    x-enum-varnames:
    - SubscriptionStatusPending
    - SubscriptionStatusActive
    - SubscriptionStatusFailed
    - SubscriptionStatusUnsubscribed
  market.TickerEvent:
    properties:
      best_ask_price:
        type: string
      best_ask_qty:
        type: string
      best_bid_price:
        type: string
      best_bid_qty:
        type: string
      exchange_timestamp:
        type: string
      id:
        type: integer
      index_price:
        type: string
      instrument_id:
        type: string
      mark_price:
        type: string
      receive_timestamp:
        type: string
      sequence_no:
        type: integer
      venue_id:
        type: string
    type: object
  market.TradeEvent:
    properties:
      exchange_timestamp:
        type: string
      exchange_trade_id:
        type: string
      id:
        type: integer
      instrument_id:
        type: string
      price:
        type: string
      quantity:
        type: string
      raw_event_id:
        type: integer
      receive_timestamp:
        type: string
      sequence_no:
        type: integer
      side:
        type: string
      venue_id:
        type: string
    type: object
  orderbook.BookState:
    enum:
    - HEALTHY
    - STALE
    - DESYNCED
    - RESYNCING
    - DISCONNECTED
    type: string
    x-enum-varnames:
    - BookStateHealthy
    - BookStateStale
    - BookStateDesynced
    - BookStateResyncing
    - BookStateDisconnected
  orderbook.DepthLevel:
    properties:
      notional:
        type: string
      price:
        type: string
      quantity:
        type: string
    type: object
  orderbook.OrderBookDepth:
    properties:
      ask_depth:
        items:
          $ref: '#/definitions/orderbook.DepthLevel'
        type: array
      best_ask:
        type: string
      best_bid:
        type: string
      bid_depth:
        items:
          $ref: '#/definitions/orderbook.DepthLevel'
        type: array
      spread:
        type: string
      timestamp:
        type: string
    type: object
  orderbook.OrderBookHealth:
    properties:
      age_ms:
        type: integer
      gap_count:
        type: integer
      instrument_id:
        type: string
      is_healthy:
        type: boolean
      last_update:
        type: string
      message:
        type: string
      resync_count:
        type: integer
      sequence:
        type: integer
      state:
        $ref: '#/definitions/orderbook.BookState'
      venue_id:
        type: string
    type: object
  orderbook.SubscribeRequest:
    properties:
      depth:
        maximum: 20
        minimum: 1
        type: integer
      instrument_id:
        type: string
      venue_id:
        type: string
    required:
    - depth
    - instrument_id
    - venue_id
    type: object
  unifiedstate.DepthLevel:
    properties:
      notional:
        type: string
      price:
        type: string
      quantity:
        type: string
    type: object
  unifiedstate.ExecutableDepth:
    properties:
      ask_depth:
        items:
          $ref: '#/definitions/unifiedstate.DepthLevel'
        type: array
      best_ask:
        type: string
      best_bid:
        type: string
      bid_depth:
        items:
          $ref: '#/definitions/unifiedstate.DepthLevel'
        type: array
      spread:
        type: string
      timestamp:
        type: string
    type: object
  unifiedstate.FundingState:
    properties:
      funding_rate:
        type: string
      index_price:
        type: string
      interval_seconds:
        type: integer
      mark_price:
        type: string
      next_funding_at:
        type: string
      received_at:
        type: string
      venue_id:
        type: string
    type: object
  unifiedstate.HealthOverview:
    properties:
      healthy_venues:
        type: integer
      stale_venues:
        type: integer
      timestamp:
        type: string
      total_instruments:
        type: integer
      unhealthy_venues:
        type: integer
      venue_health:
        additionalProperties:
          $ref: '#/definitions/unifiedstate.VenueHealthStatus'
        type: object
    type: object
  unifiedstate.InstrumentState:
    properties:
      ask_depth:
        items:
          $ref: '#/definitions/unifiedstate.DepthLevel'
        type: array
      base_asset:
        type: string
      best_ask:
        type: string
      best_ask_venue:
        type: string
      best_bid:
        type: string
      best_bid_venue:
        type: string
      bid_depth:
        items:
          $ref: '#/definitions/unifiedstate.DepthLevel'
        type: array
      canonical_symbol:
        type: string
      created_at:
        type: string
      funding:
        $ref: '#/definitions/unifiedstate.FundingState'
      funding_venue:
        type: string
      healthy_venues:
        type: integer
      id:
        type: string
      index_price:
        type: string
      instrument_id:
        type: string
      is_stale:
        type: boolean
      last_price:
        type: string
      last_update:
        type: string
      mark_price:
        type: string
      quote_asset:
        type: string
      spread:
        type: string
      total_venues:
        type: integer
      updated_at:
        type: string
      venue_states:
        additionalProperties:
          $ref: '#/definitions/unifiedstate.VenueMarketState'
        type: object
    type: object
  unifiedstate.PriceLevel:
    properties:
      price:
        type: string
      quantity:
        type: string
    type: object
  unifiedstate.VenueHealthStatus:
    enum:
    - HEALTHY
    - STALE
    - UNHEALTHY
    - UNKNOWN
    type: string
    x-enum-varnames:
    - VenueHealthHealthy
    - VenueHealthStale
    - VenueHealthUnhealthy
    - VenueHealthUnknown
  unifiedstate.VenueMarketState:
    properties:
      age_ms:
        type: integer
      ask_depth:
        items:
          $ref: '#/definitions/unifiedstate.PriceLevel'
        type: array
      best_ask:
        type: string
      best_bid:
        type: string
      bid_depth:
        items:
          $ref: '#/definitions/unifiedstate.PriceLevel'
        type: array
      funding:
        $ref: '#/definitions/unifiedstate.FundingState'
      health:
        $ref: '#/definitions/unifiedstate.VenueHealthStatus'
      index_price:
        type: string
      instrument_id:
        type: string
      last_funding:
        type: string
      last_orderbook:
        type: string
      last_price:
        type: string
      last_ticker:
        type: string
      last_update:
        type: string
      mark_price:
        type: string
      spread:
        type: string
      venue_code:
        type: string
      venue_id:
        type: string
    type: object
  venue.Capabilities:
    properties:
      has_rest:
        type: boolean
      has_ws:
        type: boolean
      supports_futures:
        type: boolean
      supports_perp:
        type: boolean
      supports_spot:
        type: boolean
    type: object
  venue.CreateVenueRequest:
    properties:
      capabilities:
        $ref: '#/definitions/venue.Capabilities'
      code:
        type: string
      exchange_name:
        type: string
      name:
        type: string
      rate_limit_rpm:
        type: integer
      rest_base_url:
        type: string
      timeout_ms:
        type: integer
      venue_type:
        allOf:
        - $ref: '#/definitions/venue.VenueType'
        enum:
        - CEX
        - PERP_DEX
      ws_url:
        type: string
    required:
    - code
    - exchange_name
    - name
    - rest_base_url
    - venue_type
    type: object
  venue.UpdateVenueRequest:
    properties:
      capabilities:
        $ref: '#/definitions/venue.Capabilities'
      exchange_name:
        type: string
      name:
        type: string
      rate_limit_rpm:
        type: integer
      rest_base_url:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/venue.VenueStatus'
        enum:
        - ACTIVE
        - DISABLED
      timeout_ms:
        type: integer
      ws_url:
        type: string
    type: object
  venue.Venue:
    properties:
      capabilities: {}
      code:
        type: string
      created_at:
        type: string
      exchange_name:
        type: string
      id:
        type: string
      metadata: {}
      name:
        type: string
      rate_limit_rpm:
        type: integer
      rest_base_url:
        type: string
      status:
        $ref: '#/definitions/venue.VenueStatus'
      timeout_ms:
        type: integer
      updated_at:
        type: string
      venue_type:
        $ref: '#/definitions/venue.VenueType'
      ws_url:
        type: string
    type: object
  venue.VenueStatus:
    enum:
    - ACTIVE
    - DISABLED
    type: string
    x-enum-varnames:
    - VenueStatusActive
    - VenueStatusDisabled
  venue.VenueType:
    enum:
    - CEX
    - PERP_DEX
    type: string
    x-enum-varnames:
    - VenueTypeCEX
    - VenueTypePerpDEX
host: localhost:8080
info:
  contact:
    email: support@arbitrage.com
    name: API Support
  description: Backend API for arbitrage trading platform
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Arbitrage Platform API
  version: "1.0"
paths:
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Change current user's password
      parameters:
      - description: Password change data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.AuthResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Revoke all refresh tokens for current user
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Get authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Get new access token using refresh token
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.AuthResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
      summary: Refresh token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Registration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.Response'
      summary: Register new user
      tags:
      - auth
  /api/v1/funding/arbitrage:
    get:
      description: Get funding arbitrage table for selected venues
      parameters:
      - collectionFormat: csv
        description: Venue IDs (min 2, max 10)
        in: query
        items:
          type: string
        name: venue_id
        required: true
        type: array
      - default: apr_4h_desc
        description: Sort by
        enum:
        - apr_1h_desc
        - apr_4h_desc
        - apy_desc
        - spread_desc
        in: query
        name: sort
        type: string
      - default: 50
        description: Items per page
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - description: Pagination cursor (from previous response meta.cursor)
        in: query
        name: cursor
        type: string
      - default: false
        description: Include stale data
        in: query
        name: include_stale
        type: boolean
      - default: false
        description: Force refresh cache
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/fundingarbitrage.FundingArbitrageResponse'
                meta:
                  $ref: '#/definitions/api.Meta'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                error:
                  $ref: '#/definitions/api.ErrorBody'
              type: object
      summary: Get funding arbitrage opportunities
      tags:
      - funding-arbitrage
  /api/v1/instruments:
    get:
      description: Get all instruments
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/instrument.Instrument'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                error:
                  $ref: '#/definitions/api.ErrorBody'
              type: object
      summary: List instruments
      tags:
      - instruments
    post:
      consumes:
      - application/json
