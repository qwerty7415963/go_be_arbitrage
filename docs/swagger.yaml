        "400":
          description: invalid wallet
          schema:
            allOf:
            - $ref: '#/definitions/github_com_qwerty7415963_go_be_arbitrage_internal_api.Response'
            - properties:
                error:
                  $ref: '#/definitions/github_com_qwerty7415963_go_be_arbitrage_internal_api.ErrorBody'
              type: object
      summary: Trader activity stream (public WS)
      tags:
      - traders
  /api/v1/traders/search:
    post:
      consumes:
      - application/json
      description: 'Trader scan over period metrics (spec v1.1). Two additive
        pagination modes: legacy keyset cursor (no page field; next page via
        meta.cursor/has_more) and numbered pages (page >= 1 selects LIMIT/OFFSET
        with offset=(page-1)*limit; a cursor in the same body is ignored; meta
        carries page/total/total_pages with total_pages=ceil(total/limit)). Public
        endpoint: group_id requires a token (AUTH-003 otherwise). Reads period_metrics
        only, never upstream.'
      parameters:
      - description: period, venue, min/max filters, sort, limit, cursor, page
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_trader.SearchRequest'
      produces:
