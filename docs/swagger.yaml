  /api/v1/traders/ws:
    get:
      description: Realtime fill-level activity for one watched wallet (DETAIL-PLAN
        §4.2). Query wallet=0x... (lowercased server-side). Server sends {type:subscribed}
        on connect, then {type:activity} per fill; client {type:ping} gets {type:pong}.
        Reconnect/resubscribe is the FE's job. No auth (public read).
      parameters:
      - description: Watched wallet address (0x...)
        in: query
        name: wallet
        required: true
        type: string
