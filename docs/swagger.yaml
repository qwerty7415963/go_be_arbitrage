        (DETAIL-PLAN §4.1). Keyset pagination on (closed_at DESC, market ASC, opened_at
        ASC); cursor opaque + HMAC-sealed. Default limit=20, allowed 1..100.
      parameters:
      - description: Wallet address (0x...)
        in: path
        name: wallet
        required: true
